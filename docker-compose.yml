# TestPilot 基础设施（生产/Linux 形态；Windows 开发直连既有 MySQL/Redis 亦可）
services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${TP_MYSQL_ROOT_PASSWORD:-testpilot}
      MYSQL_DATABASE: testpilot
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${TP_MYSQL_ROOT_PASSWORD:-testpilot}"]
      interval: 10s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["rag"]
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
